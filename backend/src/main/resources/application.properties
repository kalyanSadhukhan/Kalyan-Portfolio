# Server
server.port=${PORT:8081}

# Lazy init — JPA beans and connection pool are NOT created until first real DB request.
# This ensures /health never triggers Hikari or Hibernate initialization.
spring.main.lazy-initialization=true

# PostgreSQL (Neon)
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Prevents Hibernate from holding a DB session open for the full HTTP request lifecycle
spring.jpa.open-in-view=false

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Gemini AI
spring.ai.google.genai.api-key=${GOOGLE_API_KEY}
spring.ai.google.genai.chat.options.model=gemini-2.5-flash

spring.ai.retry.max-attempts=3
spring.ai.retry.backoff.initial-interval=1000
spring.ai.retry.backoff.multiplier=2

# Hikari Connection Pool — tuned for Render cold-start + Neon serverless PG
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
# Discard idle connections after 10s so Neon never sees stale ones
spring.datasource.hikari.idle-timeout=10000
# Force connection recycling every 20s (before Neon's server-side timeout)
spring.datasource.hikari.max-lifetime=20000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000
# CRITICAL: 0 = disabled. Prevents Hikari from firing SELECT 1 pings every N ms
# in the background — that was causing Neon CPU spikes on every UptimeRobot cycle.
spring.datasource.hikari.keepalive-time=0
# Still validate on borrow (before handing connection to Hibernate)
spring.datasource.hikari.connection-test-query=SELECT 1
